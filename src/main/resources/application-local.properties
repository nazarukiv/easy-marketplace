spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/easymarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:easymarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:easymarket_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
