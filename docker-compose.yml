services:
  mysql:
    image: mysql:8.4
    container_name: easymarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easymarket}
      MYSQL_USER: ${MYSQL_USER:-easymarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-easymarket_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easymarket_root_password}
    volumes:
      - easymarket-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - easymarket-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: easymarket-app:local
    container_name: easymarket-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-easymarket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-easymarket}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-easymarket_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - easymarket-network

volumes:
  easymarket-mysql-data:

networks:
  easymarket-network:
    driver: bridge
